<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Birthday simulation · Twenty birthdays</title>
<meta name="description" content="An interactive classroom illustration: place twenty birthdays along a year, then question your intuition.">
<style>
:root{font-family:Arial,sans-serif;color:#233e4c;background:#f4f3ee;--blue:#588ca5;--ink:#233e4c;--line:#d8e2e3;--paper:#fffefb}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 15% 0%,#e6eff0 0%,transparent 48%),#f4f3ee}button{font:inherit;color:inherit;background:#fffefb;border:1px solid #c7d5d9;border-radius:12px;padding:12px 18px;cursor:pointer;transition:background .2s,transform .2s}button:hover:not(:disabled){background:#e7eff1;transform:translateY(-1px)}button:disabled{opacity:.4;cursor:default}button:focus-visible,a:focus-visible{outline:3px solid #b96a45;outline-offset:4px}.primary{background:#315f75;color:white;border-color:#315f75;box-shadow:0 5px 14px #315f751a;font-weight:bold;min-width:210px}.primary:hover:not(:disabled){background:#234b60}main{max-width:1720px;min-height:100dvh;margin:auto;padding:22px 36px;display:flex;flex-direction:column;gap:22px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #cfdbde;padding-bottom:14px}.brand{font-size:13px;font-weight:bold;letter-spacing:1.5px}.brand-icon{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:10px;background:#dce8ec;margin-right:10px;font-size:20px}.eyebrow{display:inline-flex;align-items:center;gap:9px;font-size:12px;font-weight:bold;letter-spacing:1.8px;text-transform:uppercase;color:#568299}.eyebrow::before{content:'';width:7px;height:7px;border-radius:50%;background:#6895a4}.intro{display:flex;justify-content:space-between;align-items:center;gap:28px}h1{font:normal clamp(35px,3.7vw,60px)/1.08 Georgia,serif;letter-spacing:-1.4px;margin:12px 0;max-width:1100px}h1 em{font-weight:normal;color:#58869a}.intro p{font-size:18px;color:#687e86;margin:0;line-height:1.4}.count{flex-shrink:0;display:flex;align-items:baseline;gap:8px;border-left:1px solid #cbdadd;padding:6px 0 6px 28px;color:#738994;font-size:18px}.count strong{font:normal 60px/1 Georgia,serif;color:#315f75}.count small{display:block;font-size:12px;margin-top:4px}.panel{border:1px solid #d7e1e2;border-radius:24px;background:linear-gradient(140deg,#fffefc,#fafcfb);padding:22px 26px;box-shadow:0 12px 40px #304a5410;flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:15px}.panel-head strong{font-size:15px;font-weight:normal;color:#6a818b;letter-spacing:.4px}.panel-head span{font-size:12px;color:#6f8791;letter-spacing:1.2px;text-transform:uppercase}.timeline{flex:1;min-height:265px;display:flex;align-items:center}.timeline svg{display:block;width:100%;height:100%;max-height:440px;overflow:visible}.person{cursor:pointer;transform-box:fill-box;transform-origin:center}.person.arriving{animation:arrive .55s cubic-bezier(.2,.8,.2,1)}.person:hover .dot,.person:focus .dot{fill:#b97853}.person:focus{outline:none}.person:focus .dot{stroke:#233d48;stroke-width:3}.person .stem{stroke:#8eafbd;stroke-width:1.4}.person .dot{fill:url(#coinFill);stroke:white;stroke-width:2;filter:drop-shadow(0 3px 3px #315f7520)}.person text{pointer-events:none}.person.current .dot{fill:url(#activeFill)}.person.current .stem{stroke:#b97853}.person.current .date{fill:#a16745;font-weight:bold}@keyframes arrive{from{opacity:0;transform:translateY(-18px) scale(.7)}to{opacity:1;transform:none}}.progress-track{height:3px;background:#e7edef;border-radius:4px;overflow:hidden;margin-top:8px}.progress-track i{display:block;height:100%;width:0;background:linear-gradient(90deg,#a7c5cf,#4f829a);transition:width .35s}.controls{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.group{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.hint{font-size:12px;color:#7a8e96}.foot{display:flex;justify-content:space-between;gap:14px;align-items:center;color:#7a8e96;font-size:11px;letter-spacing:.6px}.foot a{color:inherit;text-decoration:none}.sr-only{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}[hidden]{display:none!important}@media(min-width:761px) and (min-height:650px){main{height:100dvh}.timeline{min-height:180px}}@media(max-height:800px) and (min-width:761px){main{padding:14px 28px;gap:14px}h1{font-size:42px;max-width:900px;margin:8px 0}.panel{padding:16px 22px}header{padding-bottom:10px}.count strong{font-size:50px}}@media(max-width:760px){main{padding:16px;gap:20px}.brand{font-size:11px;letter-spacing:1px}.brand-icon{margin-right:5px}.intro{gap:14px}h1{font-size:34px;letter-spacing:-.8px}.intro p{font-size:15px}.count{padding-left:12px;gap:4px}.count strong{font-size:40px}.count small{font-size:10px}.panel{padding:16px 10px}.panel-head span{font-size:10px}.timeline{overflow-x:auto;min-height:300px}.timeline svg{width:1050px;min-width:1050px;height:290px;max-height:none}.controls{align-items:stretch}.group{gap:6px}button{font-size:14px;padding:11px 12px}.primary{min-width:180px}.hint{display:none}.foot{align-items:start}.eyebrow{font-size:10px;letter-spacing:1.2px}}@media(prefers-reduced-motion:reduce){.person.arriving{animation:none}*,*::before,*::after{transition:none!important}}@media print{header button,.controls,.foot{display:none}main{height:auto!important}}
</style>
</head>
<body><main>
<header><div class="brand"><span class="brand-icon" aria-hidden="true">◷</span> THE BIRTHDAY PARADOX</div><button id="fullscreen">⛶ Full screen</button></header>
<div class="intro"><div><div class="eyebrow">Birthday simulation</div><h1>How likely is <em>at least one</em><br>shared birthday?</h1><p>20 people. 365 days. Let’s place their birthdays.</p></div><div class="count"><strong id="count">0</strong><div>/ 20<small>birthdays placed</small></div></div></div>
<section class="panel" aria-label="Birthday timeline">
<div class="panel-head"><strong>A year of birthdays</strong><span>1 January — 31 December</span></div>
<div class="timeline" id="timeline"></div>
<div class="progress-track" aria-hidden="true"><i id="progress"></i></div><div id="announcement" class="sr-only" role="status"></div>
</section>
<div class="controls"><div class="group"><button id="undo" disabled>↶ Undo</button><button id="reset" disabled>Start again</button><span class="hint">Space / → to add a birthday</span></div><div class="group"><button id="play">▶ Play</button><button id="next" class="primary">Place birthday 1 →</button></div></div>
<div class="foot"><span>20 PEOPLE · ONE YEAR</span><a href="./index.html">← Human coin activity</a></div>
</main>
<script>
// A deliberately spread-out teaching example, NOT a random sample.
const birthdays=[8,29,46,67,81,105,122,139,162,179,194,218,236,249,271,289,304,326,344,359];
// Reveal in mixed calendar order, so students watch the whole axis fill.
const order=[6,15,2,11,18,4,9,0,13,17,7,19,3,12,5,16,1,10,14,8];
const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const daysInMonth=[31,28,31,30,31,30,31,31,30,31,30,31];
const $=id=>document.getElementById(id);let placed=0,selected=null,timer=null;
function dateLabel(day){let m=0;while(day>daysInMonth[m])day-=daysInMonth[m++];return `${day} ${months[m]}`}
function pause(){clearInterval(timer);timer=null;$('play').textContent='▶ Play'}
function render(animate=false){
const x=day=>38+(day-1)/364*1124,axis=156;
let svg='<svg viewBox="0 0 1200 315" role="group" aria-label="Birthdays along a year, from 1 January to 31 December"><title>Twenty birthdays along a calendar year</title><defs><linearGradient id="coinFill" x2="0" y2="1"><stop stop-color="#7ea8ba"/><stop offset="1" stop-color="#487b94"/></linearGradient><linearGradient id="activeFill" x2="0" y2="1"><stop stop-color="#d5ad82"/><stop offset="1" stop-color="#b47c54"/></linearGradient></defs>';
let start=1;months.forEach((month,i)=>{const left=x(start),right=x(Math.min(365,start+daysInMonth[i]));svg+=`<rect x="${left}" y="26" width="${right-left-3}" height="248" rx="8" fill="${['#edf3f5','#edf3f5','#eef3ed','#eef3ed','#eef3ed','#f8f3e6','#f8f3e6','#f8f3e6','#f5ece5','#f5ece5','#f5ece5','#edf3f5'][i]}"/><text x="${(left+right)/2}" y="299" text-anchor="middle" fill="#627b86" font-size="14" font-weight="bold" letter-spacing="1">${month.toUpperCase()}</text>`;start+=daysInMonth[i]});
for(let d=1;d<=365;d++)svg+=`<line x1="${x(d)}" x2="${x(d)}" y1="${axis-3}" y2="${axis+3}" stroke="#b7c7cc"/>`;
svg+=`<line x1="38" x2="1162" y1="${axis}" y2="${axis}" stroke="#718c99" stroke-width="2"/>`;
order.slice(0,placed).forEach((index,i)=>{const day=birthdays[index],above=index%2===0,y=above?86:226,active=selected===i;svg+=`<g class="person ${active?'current':''} ${animate&&i===placed-1?'arriving':''}" role="button" tabindex="0" data-person="${i}" aria-label="Person ${i+1}: ${dateLabel(day)}"><title>Person ${i+1}: ${dateLabel(day)}</title><line class="stem" x1="${x(day)}" x2="${x(day)}" y1="${axis}" y2="${y}"/><circle cx="${x(day)}" cy="${axis}" r="4" fill="#5789a6"/><circle class="dot" cx="${x(day)}" cy="${y}" r="18"/><text x="${x(day)}" y="${y+5}" text-anchor="middle" font-size="14" fill="white">${i+1}</text><text class="date" x="${x(day)}" y="${above?y-28:y+35}" text-anchor="middle" font-size="15" fill="#385c6e">${dateLabel(day)}</text></g>`});
svg+='</svg>';$('timeline').innerHTML=svg;
$('count').textContent=placed;$('undo').disabled=$('reset').disabled=placed===0;$('next').disabled=$('play').disabled=placed===20;$('next').hidden=placed===20;$('next').textContent=`Place birthday ${placed+1} →`;$('next').hidden=false;$('next').textContent=placed===20?'All birthdays placed':`Place birthday ${placed+1} →`;$('progress').style.width=`${placed/20*100}%`;$('announcement').textContent=selected===null?'Ready to place birthdays.':`Person ${selected+1}: ${dateLabel(birthdays[order[selected]])}`;
}
function next(){if(placed>=20)return;selected=placed++;render(true);if(placed===20)pause()}
$('next').onclick=next;$('play').onclick=()=>{if(timer){pause();return}next();if(placed<20){$('play').textContent='Ⅱ Pause';timer=setInterval(next,1000)}};
$('undo').onclick=()=>{pause();placed=Math.max(0,placed-1);selected=placed?placed-1:null;render()};
$('reset').onclick=()=>{pause();placed=0;selected=null;render()};
function selectPerson(event){const person=event.target.closest('[data-person]');if(!person)return;selected=Number(person.dataset.person);render();document.querySelector(`[data-person="${selected}"]`).focus({preventScroll:true})}
$('timeline').onclick=selectPerson;$('timeline').onkeydown=event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();selectPerson(event)}};
document.addEventListener('keydown',event=>{if(event.defaultPrevented||event.repeat||event.ctrlKey||event.metaKey||event.altKey||['BUTTON','A'].includes(event.target.tagName))return;if(event.key===' '||event.key==='ArrowRight'){event.preventDefault();pause();next()}});
$('fullscreen').onclick=()=>document.fullscreenElement?document.exitFullscreen?.():document.documentElement.requestFullscreen?.();document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});render();
</script>
</body></html>
