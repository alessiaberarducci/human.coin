<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Birthday simulation · Birthday paradox</title>
<meta name="description" content="An interactive classroom illustration: place twenty birthdays along a year, then question your intuition.">
<style>
:root{font-family:Arial,sans-serif;color:#233e4c;background:#f4f3ee;--blue:#588ca5;--ink:#233e4c;--line:#d8e2e3;--paper:#fffefb}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 15% 0%,#e6eff0 0%,transparent 48%),#f4f3ee}button{font:inherit;color:inherit;background:#fffefb;border:1px solid #c7d5d9;border-radius:12px;padding:12px 18px;cursor:pointer;transition:background .2s,transform .2s}button:hover:not(:disabled){background:#e7eff1;transform:translateY(-1px)}button:disabled{opacity:.4;cursor:default}button:focus-visible,a:focus-visible{outline:3px solid #b96a45;outline-offset:4px}.primary{background:#315f75;color:white;border-color:#315f75;box-shadow:0 5px 14px #315f751a;font-weight:bold;min-width:210px}.primary:hover:not(:disabled){background:#234b60}main{max-width:1720px;min-height:100dvh;margin:auto;padding:22px 36px;display:flex;flex-direction:column;gap:22px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #cfdbde;padding-bottom:14px}.brand{font-size:13px;font-weight:bold;letter-spacing:1.5px}.brand-icon{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:10px;background:#dce8ec;margin-right:10px;font-size:20px}.eyebrow{display:inline-flex;align-items:center;gap:9px;font-size:12px;font-weight:bold;letter-spacing:1.8px;text-transform:uppercase;color:#568299}.eyebrow::before{content:'';width:7px;height:7px;border-radius:50%;background:#6895a4}.intro{display:flex;justify-content:space-between;align-items:center;gap:28px}h1{font:normal clamp(35px,3.7vw,60px)/1.08 Georgia,serif;letter-spacing:-1.4px;margin:12px 0;max-width:1100px}h1 em{font-weight:normal;color:#58869a}.intro p{font-size:18px;color:#687e86;margin:0;line-height:1.4}.count{flex-shrink:0;display:flex;align-items:baseline;gap:8px;border-left:1px solid #cbdadd;padding:6px 0 6px 28px;color:#738994;font-size:18px}.count strong{font:normal 60px/1 Georgia,serif;color:#315f75}.count small{display:block;font-size:12px;margin-top:4px}.panel{border:1px solid #d7e1e2;border-radius:24px;background:linear-gradient(140deg,#fffefc,#fafcfb);padding:22px 26px;box-shadow:0 12px 40px #304a5410;flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:15px}.panel-head strong{font-size:15px;font-weight:normal;color:#6a818b;letter-spacing:.4px}.panel-head span{font-size:12px;color:#6f8791;letter-spacing:1.2px;text-transform:uppercase}.timeline{flex:1;min-height:265px;display:flex;align-items:center}.timeline svg{display:block;width:100%;height:100%;max-height:440px;overflow:visible}.person{cursor:pointer;transform-box:fill-box;transform-origin:center}.person.arriving{animation:arrive .4s cubic-bezier(.2,.8,.2,1)}.person:focus{outline:none}.person .stem{stroke:#8eafbd;stroke-width:1.4}.person text{pointer-events:none}.person.current .stem{stroke:#b97853}@keyframes arrive{from{opacity:0;transform:translateY(-18px) scale(.7)}to{opacity:1;transform:none}}.progress-track{height:3px;background:#e7edef;border-radius:4px;overflow:hidden;margin-top:8px}.progress-track i{display:block;height:100%;width:0;background:linear-gradient(90deg,#a7c5cf,#4f829a);transition:width .35s}.controls{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.group{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.hint{font-size:12px;color:#7a8e96}.foot{display:flex;justify-content:space-between;gap:14px;align-items:center;color:#7a8e96;font-size:11px;letter-spacing:.6px}.foot a{color:inherit;text-decoration:none}.sr-only{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}[hidden]{display:none!important}@media(min-width:761px) and (min-height:650px){main{height:100dvh}.timeline{min-height:180px}}@media(max-height:800px) and (min-width:761px){main{padding:14px 28px;gap:14px}h1{font-size:42px;max-width:900px;margin:8px 0}.panel{padding:16px 22px}header{padding-bottom:10px}.count strong{font-size:50px}}@media(max-width:760px){main{padding:16px;gap:20px}.brand{font-size:11px;letter-spacing:1px}.brand-icon{margin-right:5px}.intro{gap:14px}h1{font-size:34px;letter-spacing:-.8px}.intro p{font-size:15px}.count{padding-left:12px;gap:4px}.count strong{font-size:40px}.count small{font-size:10px}.panel{padding:16px 10px}.panel-head span{font-size:10px}.timeline{overflow-x:auto;min-height:300px}.timeline svg{width:1050px;min-width:1050px;height:290px;max-height:none}.controls{align-items:stretch}.group{gap:6px}button{font-size:14px;padding:11px 12px}.primary{min-width:180px}.hint{display:none}.foot{align-items:start}.eyebrow{font-size:10px;letter-spacing:1.2px}}@media(prefers-reduced-motion:reduce){.person.arriving{animation:none}*,*::before,*::after{transition:none!important}}@media print{header button,.controls,.foot{display:none}main{height:auto!important}}

.setup{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-top:12px;color:#687e86;font-size:16px}.setup label{display:flex;align-items:center;gap:10px;color:#315f75;font-weight:bold}.setup input{width:82px;border:1px solid #c7d5d9;border-radius:10px;padding:9px 10px;font:inherit;color:#233e4c;background:#fffefb}.setup input:focus-visible{outline:3px solid #b96a45;outline-offset:3px}.calendar-controls{display:flex;align-items:center;gap:10px}.calendar-controls button{padding:9px 15px}.calendar-controls #play{background:#e5eef1;border-color:#cbdde3;color:#315f75;min-width:88px;font-weight:bold}.calendar-controls span{margin-right:10px}@media(max-width:760px){.panel-head{flex-wrap:wrap}.calendar-controls{gap:6px}.calendar-controls span{display:none}.setup{font-size:13px;gap:8px}.setup input{width:72px}.calendar-controls button{padding:8px 12px}}
.next-page{display:inline-block;padding:12px 18px;border-radius:12px;background:#315f75;color:white;text-decoration:none;font-weight:bold}.next-page:hover{background:#234b60}.next-page:focus-visible{outline:3px solid #b96a45;outline-offset:4px}

.calendar-paper{fill:#fffefb;stroke:#bed0d7;stroke-width:1;filter:drop-shadow(0 3px 4px #315f7520)}.calendar-band{fill:#588ca5}.calendar-month{fill:white;font-family:Arial,sans-serif;font-weight:bold}.calendar-day{fill:#31556a;font-family:Georgia,serif}.calendar-rings{stroke:#3b6174;stroke-width:2;stroke-linecap:round}.person.current .calendar-band,.person:hover .calendar-band,.person:focus .calendar-band{fill:#b97853}.person.current .calendar-paper{stroke:#c59a7a}.person.current .calendar-day{fill:#9d6542}.person:focus .calendar-paper{stroke:#233d48;stroke-width:2}
</style>
</head>
<body><main>
<header><div class="brand"><span class="brand-icon" aria-hidden="true">◷</span> THE BIRTHDAY PARADOX</div><button id="fullscreen">⛶ Full screen</button></header>
<div class="intro"><div><div class="eyebrow">Birthday simulation</div><h1>How likely is <em>at least one</em><br>shared birthday?</h1><div class="setup"><label for="people">People <input id="people" type="number" min="2" max="365" step="1" value="20" aria-describedby="peopleHint"></label><span id="peopleHint">365 days. Let’s place their birthdays.</span></div></div><div class="count"><strong id="count">0</strong><div>/ <span id="total">20</span><small>birthdays placed</small></div></div></div>
<section class="panel" aria-label="Birthday timeline">
<div class="panel-head"><strong>A year of birthdays</strong><div class="calendar-controls"><span>1 January — 31 December</span><button id="play">▶ Play</button><button id="all">Place all</button></div></div>
<div class="timeline" id="timeline"></div>
<div class="progress-track" aria-hidden="true"><i id="progress"></i></div><div id="announcement" class="sr-only" role="status"></div>
</section>
<div class="controls"><div class="group"><button id="undo" disabled>↶ Undo</button><button id="reset" disabled>Start again</button><span class="hint">Space / → to add a birthday</span></div><div class="group"><button id="next" class="primary">Place birthday 1 →</button><a id="compareGroups" class="next-page" href="birthday-simulations.html?n=20" hidden>Next: 10,000 random groups →</a></div></div>
<div class="foot"><span id="footLabel">20 PEOPLE · ONE YEAR</span><a href="./index.html">← Human coin activity</a></div>
</main>
<script>
// A deliberately spread-out teaching example, NOT a random sample.
const initialBirthdays=[8,29,46,67,81,105,122,139,162,179,194,218,236,249,271,289,304,326,344,359];
// Reveal in mixed calendar order, so students watch the whole axis fill.
const initialOrder=[6,15,2,11,18,4,9,0,13,17,7,19,3,12,5,16,1,10,14,8];
let total=20,birthdays=[...initialBirthdays],order=[...initialOrder];
function prepareGroup(n){
 if(n===20)return {birthdays:[...initialBirthdays],order:[...initialOrder]};
 // One date per disjoint interval: dates are guaranteed unique, not independent random draws.
 let seed=n*7919;const random=()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296};
 const dates=Array.from({length:n},(_,i)=>{const low=Math.floor(i*365/n)+1,high=Math.floor((i+1)*365/n);return Math.round((low+high)/2+(random()-.5)*(high-low)*.4)});
 const reveal=Array.from({length:n},(_,i)=>i);for(let i=n-1;i>0;i--){const j=Math.floor(random()*(i+1));[reveal[i],reveal[j]]=[reveal[j],reveal[i]]}
 return {birthdays:dates,order:reveal};
}
const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const daysInMonth=[31,28,31,30,31,30,31,31,30,31,30,31];
const $=id=>document.getElementById(id);let placed=0,selected=null,timer=null;
function dateLabel(day){let m=0;while(day>daysInMonth[m])day-=daysInMonth[m++];return `${day} ${months[m]}`}
function pause(){clearInterval(timer);timer=null;$('play').textContent='▶ Play'}
function render(animate=false){
const x=day=>38+(day-1)/364*1124,axis=156;
let svg='<svg viewBox="0 0 1200 315" role="group" aria-label="Birthdays along a year, from 1 January to 31 December"><title>Birthdays along a calendar year</title><defs><linearGradient id="coinFill" x2="0" y2="1"><stop stop-color="#7ea8ba"/><stop offset="1" stop-color="#487b94"/></linearGradient><linearGradient id="activeFill" x2="0" y2="1"><stop stop-color="#d5ad82"/><stop offset="1" stop-color="#b47c54"/></linearGradient></defs>';
let start=1;months.forEach((month,i)=>{const left=x(start),right=x(Math.min(365,start+daysInMonth[i]));svg+=`<rect x="${left}" y="26" width="${right-left-3}" height="248" rx="8" fill="${['#edf3f5','#edf3f5','#eef3ed','#eef3ed','#eef3ed','#f8f3e6','#f8f3e6','#f8f3e6','#f5ece5','#f5ece5','#f5ece5','#edf3f5'][i]}"/><text x="${(left+right)/2}" y="299" text-anchor="middle" fill="#627b86" font-size="14" font-weight="bold" letter-spacing="1">${month.toUpperCase()}</text>`;start+=daysInMonth[i]});
for(let d=1;d<=365;d++)svg+=`<line x1="${x(d)}" x2="${x(d)}" y1="${axis-3}" y2="${axis+3}" stroke="#b7c7cc"/>`;
svg+=`<line x1="38" x2="1162" y1="${axis}" y2="${axis}" stroke="#718c99" stroke-width="2"/>`;
const lanes=total<=30?2:total<=80?4:8;
const laneGap=Math.min(...birthdays.slice(lanes).map((day,i)=>x(day)-x(birthdays[i])));
const cardWidth=Math.min(total<=30?46:total<=80?34:26,laneGap-6);
const cardHeight=total<=30?52:total<=80?34:24,bandHeight=total<=30?16:total<=80?11:7;
order.slice(0,placed).forEach((index,i)=>{
 const day=birthdays[index],above=index%2===0,y=total<=30?(above?86:226):total<=80?[70,110,202,242][index%4]:[48,78,108,138,174,204,234,264][index%8],active=selected===i;
 const [date,month]=dateLabel(day).split(' '),left=-cardWidth/2,top=-cardHeight/2;
 svg+=`<g class="person ${active?'current':''} ${animate&&i===placed-1?'arriving':''}" role="button" tabindex="0" data-person="${i}" aria-label="Person ${i+1}: ${dateLabel(day)}"><title>Person ${i+1}: ${dateLabel(day)}</title><line class="stem" x1="${x(day)}" x2="${x(day)}" y1="${axis}" y2="${y}"/><circle cx="${x(day)}" cy="${axis}" r="${total>80?1:3}" fill="#5789a6"/>
 <g class="calendar" transform="translate(${x(day)},${y})">
 <rect class="calendar-paper" x="${left}" y="${top}" width="${cardWidth}" height="${cardHeight}" rx="4"/>
 <path class="calendar-band" d="M ${left+4} ${top} H ${-left-4} Q ${-left} ${top} ${-left} ${top+4} V ${top+bandHeight} H ${left} V ${top+4} Q ${left} ${top} ${left+4} ${top} Z"/>
 ${total<=120?`<text class="calendar-month" x="0" y="${top+bandHeight*.76}" text-anchor="middle" font-size="${total<=30?10:total<=80?7:5}" letter-spacing="${total<=30?1:.4}">${month.toUpperCase()}</text>`:''}
 <text class="calendar-day" x="0" y="${top+bandHeight+(cardHeight-bandHeight)*.73}" text-anchor="middle" font-size="${total<=30?25:total<=80?17:11}">${date}</text>
 ${total<=80?`<path class="calendar-rings" d="M ${-cardWidth*.27} ${top-2} v 5 M ${cardWidth*.27} ${top-2} v 5"/>`:''}
 </g></g>`;
});
svg+='</svg>';$('timeline').innerHTML=svg;
$('compareGroups').hidden=placed<total;$('compareGroups').href=`birthday-simulations.html?n=${total}`;$('count').textContent=placed;$('total').textContent=total;$('all').disabled=placed===total;$('footLabel').textContent=total>30?`${total} PEOPLE · Hover over a marker to see its date.`:`${total} PEOPLE · ONE YEAR`;$('undo').disabled=$('reset').disabled=placed===0;$('next').disabled=$('play').disabled=placed===total;$('next').hidden=placed===total;$('next').textContent=`Place birthday ${placed+1} →`;$('next').hidden=placed===total;$('next').textContent=placed===total?'All birthdays placed':`Place birthday ${placed+1} →`;$('progress').style.width=`${placed/total*100}%`;$('announcement').textContent=selected===null?'Ready to place birthdays.':`Person ${selected+1}: ${dateLabel(birthdays[order[selected]])}`;
}
function next(){if(placed>=total)return;selected=placed++;render(true);if(placed===total)pause()}
function changeGroup(n){if(n===total)return;pause();total=n;({birthdays,order}=prepareGroup(total));placed=0;selected=null;render()}
$('people').oninput=()=>{const n=Number($('people').value);if(Number.isInteger(n)&&n>=2&&n<=365)changeGroup(n)};
$('people').onchange=()=>{const n=Math.min(365,Math.max(2,Math.round(Number($('people').value))||20));$('people').value=n;changeGroup(n)};
$('people').onkeydown=event=>{if(event.key==='Enter'){event.preventDefault();$('people').onchange();$('people').blur()}};
$('all').onclick=()=>{pause();placed=total;selected=total-1;render()};
$('next').onclick=next;$('play').onclick=()=>{if(timer){pause();return}next();if(placed<total){$('play').textContent='Ⅱ Pause';timer=setInterval(next,700)}};
$('undo').onclick=()=>{pause();placed=Math.max(0,placed-1);selected=placed?placed-1:null;render()};
$('reset').onclick=()=>{pause();placed=0;selected=null;render()};
function selectPerson(event){const person=event.target.closest('[data-person]');if(!person)return;selected=Number(person.dataset.person);render();document.querySelector(`[data-person="${selected}"]`).focus({preventScroll:true})}
$('timeline').onclick=selectPerson;$('timeline').onkeydown=event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();selectPerson(event)}};
document.addEventListener('keydown',event=>{if(event.defaultPrevented||event.repeat||event.ctrlKey||event.metaKey||event.altKey||['BUTTON','A','INPUT'].includes(event.target.tagName))return;if(event.key===' '||event.key==='ArrowRight'){event.preventDefault();pause();next()}});
$('fullscreen').onclick=()=>document.fullscreenElement?document.exitFullscreen?.():document.documentElement.requestFullscreen?.();document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});const requested=Number(new URLSearchParams(location.search).get('n'));if(Number.isInteger(requested)&&requested>=2&&requested<=365){total=requested;({birthdays,order}=prepareGroup(total));$('people').value=total}render();
</script>
</body></html>
